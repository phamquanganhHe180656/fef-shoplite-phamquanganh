<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopLite - Đăng Ký</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header / Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">
                    <i class="bi bi-bag-check"></i> ShopLite
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Trang Chủ</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="register.html">Đăng Ký</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="cart.html">
                                <i class="bi bi-cart-fill"></i> Giỏ Hàng
                                <span class="badge bg-danger" id="cart-count">0</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow">
                            <div class="card-body p-5">
                                <h2 class="card-title text-center mb-4">
                                    <i class="bi bi-person-plus"></i> Đăng Ký
                                </h2>

                                <!-- Registration Form -->
                                <form id="register-form" novalidate>
                                    <!-- Full Name -->
                                    <div class="mb-3">
                                        <label for="fullname" class="form-label">Họ và Tên <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Nhập họ tên">
                                        <div class="invalid-feedback d-block" id="fullname-error"></div>
                                    </div>

                                    <!-- Email -->
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Nhập email">
                                        <div class="invalid-feedback d-block" id="email-error"></div>
                                    </div>

                                    <!-- Phone -->
                                    <div class="mb-3">
                                        <label for="phone" class="form-label">Số Điện Thoại <span class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="Nhập số điện thoại">
                                        <div class="invalid-feedback d-block" id="phone-error"></div>
                                    </div>

                                    <!-- Password -->
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Mật Khẩu <span class="text-danger">*</span></label>
                                        <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu">
                                        <div class="invalid-feedback d-block" id="password-error"></div>
                                    </div>

                                    <!-- Confirm Password -->
                                    <div class="mb-3">
                                        <label for="confirm-password" class="form-label">Xác Nhận Mật Khẩu <span class="text-danger">*</span></label>
                                        <input type="password" class="form-control" id="confirm-password" name="confirm-password" placeholder="Xác nhận mật khẩu">
                                        <div class="invalid-feedback d-block" id="confirm-password-error"></div>
                                    </div>

                                    <!-- Gender Select -->
                                    <div class="mb-3">
                                        <label for="gender" class="form-label">Giới Tính</label>
                                        <select class="form-select" id="gender" name="gender">
                                            <option value="">-- Chọn giới tính --</option>
                                            <option value="male">Nam</option>
                                            <option value="female">Nữ</option>
                                            <option value="other">Khác</option>
                                        </select>
                                    </div>

                                    <!-- Agree to Terms Checkbox -->
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="agree-terms" name="agree-terms">
                                        <label class="form-check-label" for="agree-terms">
                                            Tôi đồng ý với <a href="#" class="text-decoration-none">điều khoản và dịch vụ</a> <span class="text-danger">*</span>
                                        </label>
                                        <div class="invalid-feedback d-block" id="agree-terms-error"></div>
                                    </div>

                                    <!-- Submit Button -->
                                    <button type="submit" class="btn btn-primary w-100 mb-3">Đăng Ký</button>

                                    <!-- Success Message -->
                                    <div id="success-message" class="d-none alert alert-success">
                                        <i class="bi bi-check-circle"></i> Đăng ký thành công!
                                    </div>
                                </form>

                                <!-- Login Link -->
                                <p class="text-center text-muted mt-3">
                                    Đã có tài khoản? <a href="#" class="text-decoration-none">Đăng nhập tại đây</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <h5><i class="bi bi-bag-check"></i> ShopLite</h5>
                    <p class="text-muted">Mua sắm tiện lợi, giá cả hợp lý.</p>
                </div>
                <div class="col-md-4 mb-3">
                    <h5>Liên Kết</h5>
                    <ul class="list-unstyled text-muted">
                        <li><a href="index.html" class="text-muted">Trang Chủ</a></li>
                        <li><a href="cart.html" class="text-muted">Giỏ Hàng</a></li>
                        <li><a href="register.html" class="text-muted">Đăng Ký</a></li>
                    </ul>
                </div>
                <div class="col-md-4 mb-3">
                    <h5>Liên Hệ</h5>
                    <p class="text-muted">
                        <i class="bi bi-envelope"></i> info@shoplite.com<br>
                        <i class="bi bi-telephone"></i> +84 (0) 123 456 789
                    </p>
                </div>
            </div>
            <hr class="bg-secondary">
            <div class="text-center text-muted">
                <small>&copy; 2024 ShopLite. Bản quyền được bảo vệ.</small>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/auth.js"></script>
</body>
</html>
